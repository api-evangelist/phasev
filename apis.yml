name: PhaseV
description: 'PhaseV is a biopharma software company based in Cambridge, Massachusetts that builds
  AI and machine-learning solutions for clinical-trial optimization. Its platform helps pharmaceutical
  sponsors and CROs improve trial design, reduce enrollment and cost, shorten timelines, and increase
  probability of success through simulation and Bayesian adaptive design (Trial Optimizer), biomarker
  and patient-subgroup identification (Response Optimizer), disease-progression causal analysis
  (Portfolio Optimizer), site selection and operational analytics (ClinOps Optimizer), and ML-based
  early-derived endpoint identification. PhaseV publishes no public developer API, SDK, or documentation
  surface; this profile captures its identity and probed domain-security posture. Backed by Accel and
  Insight Partners.'
